[project]
name = "rmv-watermarks"
version = "0.1.0"
description = "Lightweight, pluggable AI visible watermark removal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rmv-watermarks contributors" }]
keywords = ["watermark", "gemini", "image-processing", "alpha-blending"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "click>=8.1",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
rmv-watermarks = "rmv_watermarks.cli:main"

[project.urls]
Repository = "https://github.com/skat/rmv-watermarks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmv_watermarks"]

[tool.hatch.build.targets.wheel.force-include]
"assets/bg_48.png" = "rmv_watermarks/assets/bg_48.png"
"assets/bg_96.png" = "rmv_watermarks/assets/bg_96.png"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["rmv_watermarks"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
